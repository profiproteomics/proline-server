jdk:
  - openjdk17
before_install:
  - sdk install maven 3.9.9 && sdk use maven 3.9.9
  - BRANCH_NAME=develop
  - printf '%s' '<settings><profiles><profile><id>ebi</id><repositories><repository><id>ebi-repo</id><url>https://www.ebi.ac.uk/Tools/maven/repos/content/groups/ebi-repo/</url></repository></repositories></profile></profiles><activeProfiles><activeProfile>ebi</activeProfile></activeProfiles></settings>' > $HOME/ebi-settings.xml
  - git clone --depth 1 --branch $BRANCH_NAME https://github.com/profiproteomics/profi-commons.git $HOME/profi-commons
  - (cd $HOME/profi-commons && mvn -q -f profi_pom/pom.xml install && mvn -q install -DskipTests)
  - curl -sSfL -o $HOME/sgfilter-1.2.jar https://repo.clojars.org/mr/go/sgfilter/sgfilter/1.2/sgfilter-1.2.jar
  - mvn -q install:install-file -Dfile=$HOME/sgfilter-1.2.jar -DgroupId=mr.go.sgfilter -DartifactId=sgfilter -Dversion=1.2 -Dpackaging=jar
  - git clone --depth 1 --branch $BRANCH_NAME https://github.com/profiproteomics/mzdb.git $HOME/mzdb
  - (cd $HOME/mzdb && mvn -q install -DskipTests)
  - git clone --depth 1 --branch $BRANCH_NAME https://github.com/profiproteomics/proline-core.git $HOME/proline-core
  - (cd $HOME/proline-core && mvn -q install -Dmaven.test.skip.exec=true)
  - git clone --depth 1 --branch $BRANCH_NAME https://github.com/profiproteomics/proline-admin.git $HOME/proline-admin
  - (cd $HOME/proline-admin && mvn -q install -Dmaven.test.skip.exec=true -pl proline-admin -am)
  - curl -sSfL -o $HOME/jacksum-3.4.0.jar https://github.com/jonelo/jacksum/releases/download/v3.4.0/jacksum-3.4.0.jar
  - mvn -q install:install-file -Dfile=$HOME/jacksum-3.4.0.jar -DgroupId=jacksum -DartifactId=jacksum -Dversion=3.4.0 -Dpackaging=jar
install:
  - mvn -s $HOME/ebi-settings.xml install -Dmaven.test.skip.exec=true -pl '!pm-mascot-parser,!proline-cortex'
